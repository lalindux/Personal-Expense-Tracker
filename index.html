<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal Expense Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar fixed-top navbar-dark text-bg-primary">
        <div class="container">
            <span class="navbar-brand">Personal Expense Tracker</span>
        </div>
    </nav>

    <main class="container my-4">
        <br>

        <h1 class="h3 mt-5">Financial Dashboard</h1>
        <p class="text-muted">Manage your income and expenses.</p>

        <div class="row g-3 mb-4">

            <div class="col-md-4">
                <div class="card summary-card p-3">
                    <p>Total Income</p>
                    <h2 id="incomeTotal">LKR 0.00</h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card summary-card p-3">
                    <p>Total Expenses</p>
                    <h2 id="expenseTotal">LKR 0.00</h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card summary-card p-3">
                    <p>Current Balance</p>
                    <h2 id="balanceTotal">LKR 0.00</h2>
                </div>
            </div>

        </div>

        <div class="card mb-4">
            <div class="card-header bg-white">Add a Transaction</div>

            <div class="card-body">
                <form id="expenseForm" novalidate>
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label for="type" class="form-label">Type</label>
                            <select id="type" class="form-select">
                                <option value="Income">Income</option>
                                <option value="Expense">Expense</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="description" class="form-label">
                                Description
                            </label>
                            <input id="description" type="text" class="form-control"
                                   placeholder="Example: Monthly Allowance">
                        </div>

                        <div class="col-md-6">
                            <label for="amount" class="form-label">
                                Amount (LKR)
                            </label>
                            <input id="amount" type="number" class="form-control"
                                   placeholder="Enter amount" min="0.01" step="0.01">
                        </div>

                        <div class="col-md-6">
                            <label for="category" class="form-label">Category</label>
                            <select id="category" class="form-select">
                                <option value="">Choose category</option>
                                <option value="Allowance">Allowance</option>
                                <option value="Salary">Salary</option>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Education">Education</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Bills">Bills</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="date" class="form-label">Date</label>
                            <input id="date" type="date" class="form-control">
                        </div>

                    </div>

                    <p id="message" class="text-danger mt-3"></p>

                    <button type="submit" class="btn btn-primary">
                        Add Transaction
                 </button>

                    <button type="button" id="clearForm"
                            class="btn btn-outline-secondary">
                        Clear Form
                    </button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-white">Transaction History</div>

            <div class="card-body">

                <div class="row g-3 mb-3">
                    <div class="col-md-5">
                        <label for="filter" class="form-label">Filter</label>
                        <select id="filter" class="form-select">
                            <option value="All">All Transactions</option>
                            <option value="Income">Income Only</option>
                            <option value="Expense">Expenses Only</option>
                        </select>
                    </div>

                    <div class="col-md-7">
                        <label for="search" class="form-label">Search</label>
                        <input id="search" type="text" class="form-control"
                               placeholder="Search description or category">
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Type</th>
                                <th>Category</th>
                                <th>Amount</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="rows"></tbody>
                    </table>
                </div>

            </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
